channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip=25
  - codecarbon=2.2
  - setuptools<81  # codecarbon 2.2 imports pkg_resources, removed in setuptools 82
  - flwr=1.15
  - frozendict=2.4.7
  - numpy=1.26.4
  - pandas=2.2.3
  - py7zr=0.22.0
  - pyarrow=19.0.1
  - pydantic=2.11.5
  # Stessa versione dei client Jetson (immagine NVIDIA pytorch:24.12-py3-igpu)
  - pytorch=2.6.0=cuda126*
  - cuda-version=12.6
  - pyzmq=26.4.0
  - scikit-learn=1.6.1
  - torchaudio=2.6.0=cuda126*
  - torchvision=0.21.0=cuda126*
