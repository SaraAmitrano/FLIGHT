[project]
name = "flight-common"
version = "1.3.0"
description = "Common FLIGHT utilities"
# readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4", "pyzmq==26.4.0", "pydantic==2.11.5"]

[tool.uv_build]
src-layout = true

[dependency-groups]
dev = [
    "ruff>=0.14,<0.15",
    "ipykernel>=6.29,<6.30",
    "ipywidgets>=8.0,<9.0",
    "matplotlib>=3.10,<3.11",
    "more-itertools==10.6",
    "requests>=2.32,<2.33",
    "tqdm==4.67",
]

[build-system]
requires = ["uv_build>=0.9.8"]
build-backend = "uv_build"
